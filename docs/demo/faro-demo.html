<title>Faro Resultados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Faro · resultados. Chrome da UI segue o protótipo (roxo); gráficos usam a paleta validada do skill dataviz. */
:root{
  --bg:#FBF9FE;--surface:#FFFFFF;--ink:#24123A;--muted:#6E6280;--line:#E6DEF0;--brand:#6B3FA0;--on-brand:#FFFFFF;--brand-soft:#EFE7F8;

  /* dataviz · validado com scripts/validate_palette.js (modo light) */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ctrl:#898781;
  --st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-critical:#d03b3b;
  --tx1:#0b0b0b;--tx2:#52514e;--tx3:#898781;--grid:#e1e0d9;--base:#c3c2b7;--delta-good:#006300;--delta-bad:#b00020;
  color-scheme:light}
:root[data-theme="dark"]{--bg:#150B21;--surface:#1F132E;--ink:#F1EAF9;--muted:#A99BBB;--line:#352648;--brand:#B892EA;--on-brand:#1A0E28;--brand-soft:#2C1D40;--gate-soft:#3A2E10;--risk:#FF7A7F;--risk-soft:#3A1A24;--ok:#63CC98;--ok-soft:#16302A;--warn:#F2B544;--warn-soft:#33280F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctrl:#a09e97;--tx1:#f0efec;--tx2:#c3c2b7;--tx3:#898781;--grid:#2c2c2a;--base:#383835;--delta-good:#0ca30c;--delta-bad:#ff7a7f;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150B21;--surface:#1F132E;--ink:#F1EAF9;--muted:#A99BBB;--line:#352648;--brand:#B892EA;--on-brand:#1A0E28;--brand-soft:#2C1D40;--gate-soft:#3A2E10;--risk:#FF7A7F;--risk-soft:#3A1A24;--ok:#63CC98;--ok-soft:#16302A;--warn:#F2B544;--warn-soft:#33280F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctrl:#a09e97;--tx1:#f0efec;--tx2:#c3c2b7;--tx3:#898781;--grid:#2c2c2a;--base:#383835;--delta-good:#0ca30c;--delta-bad:#ff7a7f;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;min-height:280px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
.demo-note{font-size:12px;color:var(--muted);margin:0 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;gap:0 0}
aside{border-right:1px solid var(--line);padding:28px 18px 28px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}

.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:inline-block;flex:none}

.side-note{margin:0;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
main{padding:36px clamp(16px,4vw,48px) 80px;max-width:1240px;width:100%}
h1{font-size:clamp(26px,3vw,34px);line-height:1.15;margin:0 0 6px;font-weight:800}
h2{font-size:19px;margin:0 0 4px;font-weight:700}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}

.s-rodando{color:var(--ok);background:var(--ok-soft)}.s-configurado_no_dy,.s-pronto_para_configurar,.s-design_completo,.s-rascunho{color:var(--brand);background:var(--brand-soft)}.s-decidido{color:var(--warn);background:var(--warn-soft)}.s-encerrado,.s-cancelado{color:var(--muted);background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}

.banner.risk{background:var(--risk-soft);color:var(--risk)}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.sintese{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:14.5px}
.doit{border-radius:12px;padding:14px 18px;border-left:5px solid}
.doit b{font-size:17px}.doit p{margin:4px 0 0;font-size:14px}
.do-ok{background:var(--ok-soft);border-color:var(--ok)}.do-warn{background:var(--gate-soft);border-color:var(--gate)}.do-risk{background:var(--risk-soft);border-color:var(--risk)}.do-info{background:var(--brand-soft);border-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}

.how{margin-top:24px;color:var(--muted);font-size:14px}.how summary{cursor:pointer;font-weight:700;color:var(--ink)}.how p{max-width:75ch}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:14px;display:inline-block}
.back:hover{color:var(--ink)}
.notes{font-size:12.5px;color:var(--muted);margin-top:18px}
.notes li{margin-bottom:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lineage{font-size:12.5px;color:var(--muted)}

.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filters .lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-right:-4px}
.filters .grow{flex:1}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.exports .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}

.tiles{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin:18px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile.hero{grid-column:auto}
.tile .k{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile .v{font-size:26px;font-weight:800;line-height:1.1;color:var(--ink)}
.tile.hero .v{font-size:40px}
.tile .d{font-size:13px;color:var(--muted);margin-top:6px}
.tile .d b{color:var(--ink);font-weight:600}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink)}
.st i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex:none}
.st-good i{background:var(--st-good)}.st-warn i{background:var(--st-warn);color:#1a1a19}.st-serious i{background:var(--st-serious)}.st-critical i{background:var(--st-critical)}.st-none i{background:var(--tx3)}
.dg{color:var(--delta-good)}.db{color:var(--delta-bad)}
.bar-prog{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:8px}
.bar-prog span{display:block;height:100%;background:var(--s1);border-radius:4px}

.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.charts .wide{grid-column:1/-1}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.chart-h p{margin:0;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.line{height:2px;width:16px;border-radius:1px}
.sw.dash{height:0;width:16px;border-top:2px dashed var(--base)}
svg.lc,svg.bc{width:100%;height:auto;display:block;overflow:visible;font-family:inherit}
svg text{fill:var(--tx2);font-size:11px}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .base{stroke:var(--base);stroke-width:1}
svg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .ref{fill:none;stroke:var(--base);stroke-width:1.5;stroke-dasharray:4 4}
svg .xh{stroke:var(--tx2);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
svg .mk{stroke:var(--surface);stroke-width:2;pointer-events:none}
svg .hit{fill:transparent;pointer-events:all}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.multi .m{min-width:0}
.multi .m h4{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.multi .m .mv{font-size:12px;color:var(--muted);margin-bottom:4px}
/* forest */
.forest{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(220px,3fr) minmax(170px,1.3fr);gap:0 12px;align-items:center}
.forest>div{padding:5px 0;border-bottom:1px solid var(--line);min-width:0}
.forest .sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding-top:12px;border-bottom:0}
.forest .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.forest .nm b{font-weight:600}
.forest .vl{font-size:13px;color:var(--tx2);text-align:right;white-space:nowrap}
.forest .vl b{font-weight:700}
.forest .ax{border-bottom:0;grid-column:2}
.forest.norte-row>div{background:var(--brand-soft)}
.fr svg{width:100%;height:26px;display:block;overflow:visible}
.fr .ci{stroke-width:2;stroke-linecap:round}
.fr .pt{stroke:var(--surface);stroke-width:2}
.fr .zero{stroke:var(--base);stroke-width:1}
.c-good{color:var(--st-good);stroke:var(--st-good);fill:var(--st-good)}
.c-critical{color:var(--st-critical);stroke:var(--st-critical);fill:var(--st-critical)}
.c-warn{color:var(--st-warn);stroke:var(--st-warn);fill:var(--st-warn)}
.c-none{color:var(--ctrl);stroke:var(--ctrl);fill:var(--ctrl)}
.c-s1{stroke:var(--s1);fill:var(--s1)}
/* funil */
.fhead,.fstep{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(220px,3fr) minmax(130px,1fr) minmax(130px,1fr);gap:0 14px;align-items:center}
.fhead{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0 6px;border-bottom:1px solid var(--line)}
.fstep{padding:8px 0;border-bottom:1px solid var(--line)}
.fstep:last-of-type{border-bottom:0}
.fn{font-size:13.5px;min-width:0}.fn b{font-weight:600}
.fb{display:flex;flex-direction:column;gap:2px}
.fbar{height:12px;background:var(--grid);border-radius:0 4px 4px 0;overflow:hidden}
.fbar span{display:block;height:100%;border-radius:0 4px 4px 0;min-width:1px}
.fv{font-size:13px;color:var(--tx1);font-weight:600;white-space:nowrap}
.fv .small{font-weight:600}
@media (max-width:760px){.fhead,.fstep{grid-template-columns:1fr 2fr 1fr 1fr;gap:0 8px}}
/* tooltip */
.tip{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.12);pointer-events:none;max-width:280px;line-height:1.4}
.tip b{font-weight:700}.tip .r{display:flex;justify-content:space-between;gap:14px}.tip .r span:last-child{font-weight:600}
.tip .t{font-weight:700;margin-bottom:3px;color:var(--muted);font-size:12px}
/* dados brutos */
.raw details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 16px;margin-top:10px}
.raw summary{cursor:pointer;font-weight:700}
.raw .table-wrap{border:0;margin-top:8px}
.raw table{min-width:0;font-size:13px}
code.ep{font-size:12.5px;background:var(--brand-soft);padding:1px 6px;border-radius:6px}
@media (max-width:980px){.charts{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.tile.hero{grid-column:span 2}.forest{grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) minmax(120px,1fr)}}

  <aside>
    <div class="logo"><span class="mark"></span><div>Faro<small>Experimentos Petlove</small></div></div>

      <button type="button" class="theme" data-theme-toggle aria-label="Alternar tema">◐ Tema</button>
      <p class="side-note">Demonstração do hackathon · tela de resultados da frente 4 (unificação de métricas) com dados embutidos: Nexus real (DY) e 5 cenários simulados. Na aplicação os mesmos dados vêm de <code>/api/results</code>.</p>

<script>
/* Faro · tela de resultados (frente 4). Vanilla JS sobre a API /api.
 * Visualização segue o skill dataviz: forma pelo "trabalho" do dado, um eixo só, paleta validada,
 * marcas finas, grade em hairline, tooltip por padrão, legenda para ≥2 séries, tabela como gêmea dos gráficos. */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInt = (n) => Math.round(n).toLocaleString('pt-BR');
const compact = (n) => Math.abs(n) >= 1e6 ? (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : Math.abs(n) >= 1e3 ? (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : fmtInt(n);
const pct = (x, d = 1) => (x * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const brl = (x) => 'R$ ' + x.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fd = (d, dec = 1) => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d * 100).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + '%';
const dm = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
const STATUS = { rascunho: 'Rascunho', design_completo: 'Design completo', pronto_para_configurar: 'Pronto para configurar', configurado_no_dy: 'Agendado', rodando: 'Rodando', decidido: 'Decidido', encerrado: 'Encerrado', cancelado: 'Cancelado' };
const PLAT = { all: 'Consolidado', site: 'Site', android: 'App Android', ios: 'App iOS' };
const BU = { ecom: 'Ecom', saude: 'Saúde', fintech: 'Fintech', servicos: 'Serviços', ecossistema: 'Ecossistema' };
// rótulo de significância → [texto, classe chip, ícone, classe de status (cor reservada, sempre com ícone + texto)]
const LABEL = { melhora_confirmada: ['Melhora confirmada', 'sg-up', '▲', 'good'], queda_confirmada: ['Queda confirmada', 'sg-down', '▼', 'critical'], tendencia_de_melhora: ['Tendência de melhora', 'sg-tup', '▲', 'good'], tendencia_de_queda: ['Tendência de queda', 'sg-tdown', '▼', 'warn'], sem_tendencia: ['Sem tendência', 'sg-none', '—', 'none'] };
const SECTIONS = ['Engajamento', 'eCom', 'Clube', 'Saúde', 'Fintech', 'Retenção', 'Atendimento', 'Operação'];
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)']; // ordem fixa; controle usa --ctrl

/* ---------- export ---------- */

  if (r.sample) tiles.push(`<div class="tile"><div class="k">Amostra ${stat(r.sample.progress >= 1 ? 'good' : r.sample.earlySignificanceAlert ? 'warn' : 'none', r.sample.progress >= 1 ? '✓' : '…', r.sample.progress >= 1 ? 'completa' : 'em coleta')}</div><div class="v">${pct(r.sample.progress, 0)}</div><div class="d"><b>${compact(r.sample.minPerArm)}</b> de ${compact(r.sample.requiredPerArm)} por grupo${r.sample.earlySignificanceAlert ? ' · significância precoce, aguardar amostra' : ''}</div><div class="bar-prog"><span style="width:${Math.min(100, r.sample.progress * 100)}%"></span></div></div>`);
  else tiles.push(`<div class="tile"><div class="k">Período</div><div class="v">${days.length || '—'} dias</div><div class="d">${dm(r.readWindow.start)} a ${dm(r.readWindow.end)}${r.srm.unstableSplitDays ? ` · ${r.srm.unstableSplitDays} dias excluídos` : ''}</div></div>`);
  tiles.push(`<div class="tile"><div class="k">Split ${r.srm.alert ? stat('critical', '!', 'SRM') : stat('good', '✓', 'ok')}</div><div class="v">${r.srm.observedShares.map((x) => pct(x, 1)).join(' / ')}</div><div class="d">planejado ${r.srm.plannedShares.map((x) => pct(x, 0)).join(' / ')} · p ${r.srm.pValue < 0.0001 ? '< 0,0001' : '= ' + r.srm.pValue.toFixed(3)}</div></div>`);
  const tilesHtml = `<div class="tiles">${tiles.join('')}</div>`;

  // ---- gráfico 1: impacto por métrica (forest: delta + IC95, zero como referência)
  const ids = Object.keys(byMetric).sort((a, b) => SECTIONS.indexOf(byId[a]?.section) - SECTIONS.indexOf(byId[b]?.section) || S.metrics.findIndex((m) => m.id === a) - S.metrics.findIndex((m) => m.id === b));
  const frows = ids.map((id) => { const m = byId[id] ?? { name: id, section: 'Outras', unit: 'count', direction: 'higher_better' }; const v = variant ? byMetric[id][variant.key] : null; return { id, m, v, c: byMetric[id][control.key], delta: v?.deltaRelative, lower: v?.ci95?.lower, upper: v?.ci95?.upper }; }).filter((x) => x.delta != null);
  let forest = '';
  if (frows.length) {
    const ext = frows.flatMap((x) => [x.delta, x.lower ?? x.delta, x.upper ?? x.delta]);
    let lo = Math.min(0, ...ext), hi = Math.max(0, ...ext); const span = (hi - lo) || 0.01; lo -= span * 0.1; hi += span * 0.1;
    let sec = '', cells = '';
    for (const x of frows) {
      if (x.m.section !== sec) { sec = x.m.section; cells += `<div class="sec">${esc(sec)}</div>`; }
      const role = roleOf(e, x.id), l = x.v.label ? LABEL[x.v.label] : LABEL.sem_tendencia;
      const tipHtml = `<div class="t">${esc(x.m.name)}</div><div class="r"><span>${esc(control.name)}</span><span>${esc(fv(x.m, x.c?.value))}</span></div><div class="r"><span>${esc(variant.name)}</span><span>${esc(fv(x.m, x.v.value))}</span></div><div class="r"><span>Delta</span><span>${esc(fd(x.delta))}</span></div>${x.lower != null ? `<div class="r"><span>IC95</span><span>${esc(fd(x.lower))} a ${esc(fd(x.upper))}</span></div>` : ''}<div class="r"><span>Chance de ser melhor</span><span>${Math.round(x.v.probBetter * 100)}%</span></div><div class="r"><span>n</span><span>${fmtInt(x.c?.n ?? 0)} × ${fmtInt(x.v.n)}</span></div>`;
      const st = role === 'norte' ? ' style="background:var(--brand-soft)"' : '';
      cells += `<div class="nm"${st} data-tip="${esc(tipHtml)}"><b>${esc(x.m.name)}</b> ${TAG[role]}${x.v.maturing ? ' <span class="tg">maturando</span>' : ''}</div><div class="fr"${st} data-tip="${esc(tipHtml)}">${forestRow(x, lo, hi, l[3])}</div><div class="vl"${st} data-tip="${esc(tipHtml)}"><b class="${isGood(x.m, x.delta) ? 'dg' : 'db'}">${fd(x.delta)}</b> ${stat(l[3], l[2], l[0])}</div>`;
    }
    cells += `<div></div><div class="ax">${forestAxis(lo, hi)}</div><div></div>`;
    forest = `<div class="panel wide"><div class="chart-h"><h3>Impacto por métrica</h3><p>Delta relativo da variante sobre o controle; traço = IC95 quando disponível; linha vertical = zero. Cor e ícone marcam o rótulo de significância.</p></div><div class="forest">${cells}</div>
      <div class="legend"><span><span class="sw" style="background:var(--st-good)"></span>melhora (confirmada ou tendência)</span><span><span class="sw" style="background:var(--st-warn)"></span>tendência de queda</span><span><span class="sw" style="background:var(--st-critical)"></span>queda confirmada</span><span><span class="sw" style="background:var(--ctrl)"></span>sem tendência</span></div></div>`;
  }

  // ---- gráfico 2: expostos por dia em pequenos múltiplos (escala própria por variante → sem eixo duplo)
  const hp = r.health.filter((h) => h.platform === S.platform);
  let daily = '';
  if (days.length) {
    const seriesOf = (key) => days.map((d) => hp.find((h) => h.date === d && h.variantKey === key)?.exposedUsers ?? null);
    const multis = r.variants.map((v) => { const vals = seriesOf(v.key), tot = vals.reduce((a, b) => a + (b ?? 0), 0); return `<div class="m"><h4><span class="sw" style="background:${colorOf(r.variants, v.key)}"></span>${esc(v.name)}${v.isControl ? ' <span class="muted" style="font-weight:500">(controle)</span>' : ''}</h4><div class="mv">${compact(tot)} no período · média ${compact(tot / days.length)}/dia</div>${lineChart({ dates: days, series: [{ name: v.name, color: colorOf(r.variants, v.key), values: vals, fmt: fmtInt }], w: 320, h: 150 })}</div>`; }).join('');
    const ctrl = seriesOf(control.key), tot = days.map((_, i) => r.variants.reduce((a, v) => a + (seriesOf(v.key)[i] ?? 0), 0));
    const share = days.map((_, i) => (tot[i] ? ctrl[i] / tot[i] : null));
    const shareChart = `<div class="m"><h4><span class="sw line" style="background:var(--tx2)"></span>Participação do controle</h4><div class="mv">observado por dia vs. ${pct(control.plannedShare, 0)} planejado <span class="sw dash" style="vertical-align:middle"></span></div>${lineChart({ dates: days, series: [{ name: 'controle', color: 'var(--tx2)', values: share, fmt: (x) => pct(x, 1) }], ref: control.plannedShare, yfmt: (x) => pct(x, 0), w: 320, h: 150 })}</div>`;
    daily = `<div class="panel wide"><div class="chart-h"><h3>Expostos por dia</h3><p>${days.length} dias, ${PLAT[S.platform].toLowerCase()}, grão ${grainTxt}. Cada painel tem a própria escala; a participação do controle mostra desvio do split planejado (origem do alerta de SRM).</p></div><div class="multi">${multis}${shareChart}</div></div>`;
  }

  // ---- gráfico 3: NORTE por plataforma (barras com IC, mesma escala)
  let platChart = '';
  if (plats.length > 2 && variant) {
    const rows = plats.map((p) => { const rr = perPlat[p]; const x = rr.results.find((q) => q.metricId === norteId && q.variantKey === variant.key); const c = rr.results.find((q) => q.metricId === norteId && q.variantKey === control.key); return x ? { label: PLAT[p], delta: x.deltaRelative, lower: x.ci95?.lower, upper: x.ci95?.upper, tip: `<div class="t">${esc(PLAT[p])} · ${esc(norte.name)}</div><div class="r"><span>${esc(control.name)}</span><span>${esc(fv(norte, c?.value))}</span></div><div class="r"><span>${esc(variant.name)}</span><span>${esc(fv(norte, x.value))}</span></div><div class="r"><span>Delta</span><span>${esc(fd(x.deltaRelative))}</span></div><div class="r"><span>Chance de ser melhor</span><span>${Math.round(x.probBetter * 100)}%</span></div><div class="r"><span>n</span><span>${fmtInt(c?.n ?? 0)} × ${fmtInt(x.n)}</span></div>` } : null; }).filter(Boolean);
    if (rows.length > 1) platChart = `<div class="panel"><div class="chart-h"><h3>NORTE por plataforma</h3><p>${esc(norte.name)}: delta relativo em cada recorte, mesma escala.</p></div>${barsCI({ rows })}</div>`;
  }
  // ---- gráfico 4: volumes por variante (barras, 100% = controle) — só faz sentido com split parelho; senão, taxa por usuário
  let volChart = '';
  if (vc && vv) {
    const rows = [['Compradores / expostos', vc.buyers / vc.users, vv.buyers / vv.users, (x) => pct(x, 2)], ['Transações / expostos', vc.transactions / vc.users, vv.transactions / vv.users, (x) => x.toLocaleString('pt-BR', { maximumFractionDigits: 3 })], ['Receita / exposto', vc.revenue / vc.users, vv.revenue / vv.users, brl], ['Ticket médio', vc.revenue / (vc.transactions || 1), vv.revenue / (vv.transactions || 1), brl]]
      .map(([label, c, v, f]) => ({ label, delta: c ? (v - c) / c : null, tip: `<div class="t">${esc(label)}</div><div class="r"><span>${esc(control.name)}</span><span>${esc(f(c))}</span></div><div class="r"><span>${esc(variant.name)}</span><span>${esc(f(v))}</span></div>` }));
    volChart = `<div class="panel"><div class="chart-h"><h3>Volumes normalizados</h3><p>Razões derivadas dos volumes (sem teste de significância), variante vs. controle.</p></div>${barsCI({ rows })}</div>`;
  }
  // ---- gráfico 5: funil da jornada (barras horizontais por passo, normalizadas pelos expostos de cada variante)
  let funnel = '', funnelRows = [];
  if (r.funnel?.rows.length) {
    const steps = [...r.funnel.steps].sort((a, b) => a.order - b.order);
    const users = (key, stepId) => r.funnel.rows.find((x) => x.variantKey === key && x.stepId === stepId)?.users ?? null;
    const topOf = Object.fromEntries(r.variants.map((v) => [v.key, users(v.key, steps[0].stepId) || 0]));
    funnelRows = steps.map((st, i) => ({ st, cells: r.variants.map((v) => { const u = users(v.key, st.stepId), prev = i ? users(v.key, steps[i - 1].stepId) : null; return { v, u, share: topOf[v.key] ? u / topOf[v.key] : null, step: prev ? u / prev : null }; }) }));
    const body = funnelRows.map(({ st, cells }, i) => {
      const c = cells.find((x) => x.v.isControl), vv = cells.find((x) => !x.v.isControl);
      const dShare = c?.share && vv?.share != null ? (vv.share - c.share) / c.share : null, dStep = c?.step && vv?.step != null ? (vv.step - c.step) / c.step : null;
      const tipHtml = `<div class="t">${esc(st.name)}</div>` + cells.map((x) => `<div class="r"><span><span class="sw" style="background:${colorOf(r.variants, x.v.key)}"></span> ${esc(x.v.name)}</span><span>${x.u == null ? '—' : fmtInt(x.u)} · ${x.share == null ? '—' : pct(x.share, 1)}</span></div>`).join('');
      const bars = cells.map((x) => `<div class="fbar"><span style="width:${((x.share ?? 0) * 100).toFixed(2)}%;background:${colorOf(r.variants, x.v.key)}"></span></div>`).join('');
      return `<div class="fstep" data-tip="${esc(tipHtml)}"><div class="fn"><b>${i + 1}. ${esc(st.name)}</b>${st.metricId ? `<div class="small muted">${esc(metricName(st.metricId))}</div>` : ''}</div><div class="fb">${bars}</div>
        <div class="fv"><div>${cells.map((x) => `<span>${x.share == null ? '—' : pct(x.share, 1)}</span>`).join(' <span class="muted">·</span> ')}</div>${i && dShare != null ? `<div class="small ${dShare >= 0 ? 'dg' : 'db'}">${fd(dShare)} vs controle</div>` : ''}</div>
        <div class="fv">${i ? `<div>${cells.map((x) => `<span>${x.step == null ? '—' : pct(x.step, 1)}</span>`).join(' <span class="muted">·</span> ')}</div>${dStep != null ? `<div class="small ${dStep >= 0 ? 'dg' : 'db'}">${fd(dStep)} vs controle</div>` : ''}` : '<span class="muted">—</span>'}</div></div>`;
    }).join('');
    funnel = `<div class="panel wide"><div class="chart-h"><h3>Funil da jornada</h3><p>Cada barra é a parcela dos expostos daquela variante que chegou ao passo (100% no topo), o que permite comparar formas mesmo com split desigual. "Passo a passo" é a conversão sobre o passo anterior.</p></div>
      <div class="fhead"><div></div><div></div><div>% dos expostos</div><div>Passo a passo</div></div>${body}
      <div class="legend">${r.variants.map((v) => `<span><span class="sw" style="background:${colorOf(r.variants, v.key)}"></span>${esc(v.name)}${v.isControl ? ' (controle)' : ''}</span>`).join('')}</div></div>`;
  }
  const charts = `<div class="charts">${forest}${funnel}${daily}${platChart}${volChart}</div>`;

  // ---- tabela (gêmea dos gráficos) + volumes
  let tbody = '';
  if (vc && vv) for (const [label, k, money] of [['Usuários', 'users'], ['Compradores', 'buyers'], ['Transações', 'transactions'], ['Receita', 'revenue', true]]) {
    const d = vc[k] ? (vv[k] - vc[k]) / vc[k] : null;
    tbody += `<tr><td><b>${label}</b></td><td class="num">${money ? 'R$ ' : ''}${fmtInt(vc[k])}</td><td class="num vline">${money ? 'R$ ' : ''}${fmtInt(vv[k])}</td><td class="num muted">${d == null ? '—' : fd(d)}</td><td class="muted">—</td><td class="muted">—</td></tr>`;
  }
  let sec = '';
  for (const id of ids) {
    const m = byId[id] ?? { name: id, section: 'Outras', unit: 'count', direction: 'higher_better' };
    const c = byMetric[id][control.key], v = variant ? byMetric[id][variant.key] : null;
    if (m.section !== sec) { sec = m.section; tbody += `<tr class="msec"><td colspan="6">${esc(sec)}</td></tr>`; }
    const role = roleOf(e, id), g = isGood(m, v?.deltaRelative), l = v?.label ? LABEL[v.label] : null;
    tbody += `<tr class="${role === 'norte' ? 'norte' : ''}"><td><b>${esc(m.name)}</b> ${TAG[role]}${v?.maturing ? ' <span class="tg">ainda maturando</span>' : ''}</td>
      <td class="num">${fv(m, c?.value)}<div class="small muted">n ${fmtInt(c?.n ?? 0)}</div></td><td class="num vline">${fv(m, v?.value)}<div class="small muted">n ${fmtInt(v?.n ?? 0)}</div></td>
      <td class="num ${g == null ? 'muted' : g ? 'dg' : 'db'}"><b>${v?.deltaRelative == null ? '—' : fd(v.deltaRelative)}</b></td>
      <td class="num muted">${v?.ci95 ? `${fd(v.ci95.lower)} a ${fd(v.ci95.upper)}` : '—'}</td>
      <td>${l ? `<span class="sg ${l[1]}">${l[2]} ${l[0]} <span class="pp">(${Math.round(v.probBetter * 100)}%)</span></span>` : '—'}</td></tr>`;
  }
  const table = `<div class="spread" style="margin:28px 0 12px;align-items:center"><h2 style="margin:0">Tabela de métricas</h2><span class="small muted">mesmos números dos gráficos · <button class="btn" data-export="metrics">baixar CSV</button></span></div>
    ${r.results.length ? `<div class="table-wrap"><table><thead><tr><th>Métrica</th><th class="num">${esc(control.name)} (controle)</th><th class="num vline">${esc(variant?.name ?? 'variante')}</th><th class="num">Delta</th><th class="num">IC95</th><th>Significância <span class="small">(chance de a variante ser melhor)</span></th></tr></thead><tbody>${tbody}</tbody></table></div>` : `<div class="panel empty">Sem resultados para ${PLAT[S.platform].toLowerCase()} no grão ${grainTxt}.</div>`}`;

  // ---- detectabilidade + dados brutos
  const mdeRows = r.mde.map((row) => `<tr class="${roleOf(e, row.metricId) === 'norte' ? 'norte' : ''}"><td>${esc(metricName(row.metricId))} ${roleOf(e, row.metricId) === 'norte' ? TAG.norte : ''}</td><td class="num">${row.mdeCurrent == null ? '—' : pct(row.mdeCurrent)}</td><td class="num muted">${row.mdeDesign != null ? pct(row.mdeDesign, 0) : '—'}</td></tr>`).join('');
  const dailyRows = days.map((d) => `<tr><td>${d}</td>${r.variants.map((v) => `<td class="num">${fmtInt(hp.find((h) => h.date === d && h.variantKey === v.key)?.exposedUsers ?? 0)}</td>`).join('')}</tr>`).join('');
  const raw = `<div class="raw" style="margin-top:28px"><h2>Dados brutos</h2><p class="small muted" style="margin:0 0 4px">Tudo que a tela usa vem de <code class="ep">GET /api/results/${esc(e.faroId)}?platform=${esc(S.platform)}&amp;grain=${esc(S.grain)}</code>. Os CSVs usam vírgula como separador e ponto decimal (prontos para Sheets, pandas e BigQuery).</p>
    <details><summary>Detectabilidade hoje (MDE, 80% de poder) · ${r.mde.length} métricas</summary><div class="table-wrap"><table><thead><tr><th>Métrica</th><th class="num">MDE atual</th><th class="num">MDE do design</th></tr></thead><tbody>${mdeRows}</tbody></table></div></details>
    <details><summary>Série diária de expostos · ${days.length} dias · <button class="btn" data-export="health">baixar CSV</button></summary><div class="table-wrap"><table><thead><tr><th>Data</th>${r.variants.map((v) => `<th class="num">${esc(v.name)}</th>`).join('')}</tr></thead><tbody>${dailyRows}</tbody></table></div></details>
    ${funnelRows.length ? `<details><summary>Funil da jornada · ${funnelRows.length} passos · <button class="btn" data-export="funnel">baixar CSV</button></summary><div class="table-wrap"><table><thead><tr><th>Passo</th>${r.variants.map((v) => `<th class="num">${esc(v.name)}</th><th class="num">% expostos</th><th class="num">passo a passo</th>`).join('')}</tr></thead><tbody>${funnelRows.map(({ st, cells }) => `<tr><td>${st.order + 1}. ${esc(st.name)}</td>${cells.map((x) => `<td class="num">${x.u == null ? '—' : fmtInt(x.u)}</td><td class="num muted">${x.share == null ? '—' : pct(x.share, 2)}</td><td class="num muted">${x.step == null ? '—' : pct(x.step, 2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>` : ''}
    <details><summary>Volumes por plataforma · <button class="btn" data-export="volumes">baixar CSV</button></summary><div class="table-wrap"><table><thead><tr><th>Plataforma</th><th>Variante</th><th class="num">Usuários</th><th class="num">Compradores</th><th class="num">Transações</th><th class="num">Receita</th></tr></thead><tbody>${plats.flatMap((p) => perPlat[p].volumes.map((v) => `<tr><td>${PLAT[p]}</td><td>${esc(r.variants.find((x) => x.key === v.variantKey)?.name ?? v.variantKey)}</td><td class="num">${fmtInt(v.users)}</td><td class="num">${fmtInt(v.buyers)}</td><td class="num">${fmtInt(v.transactions)}</td><td class="num">${brl(v.revenue)}</td></tr>`)).join('')}</tbody></table></div></details>
    <details><summary>Resposta completa da API (JSON) · <button class="btn" data-export="json">baixar</button></summary><pre class="small" style="overflow:auto;max-height:360px;margin:8px 0 0">${esc(JSON.stringify({ ...r, health: `[${r.health.length} pontos]`, results: `[${r.results.length} linhas]` }, null, 2))}</pre></details></div>`;
  const how = `<details class="how"><summary>Como os números são calculados</summary><p>Usuários que viram mais de uma variante são excluídos. Taxas usam teste z de duas proporções; valores por usuário usam aproximação normal com a variância observada; razões usam o delta method. "Chance de ser melhor" é a probabilidade de a variante superar o controle: acima de 95% é melhora confirmada, abaixo de 5% é queda confirmada, entre 80% e 95% (ou 5% e 20%) é tendência. Para métricas em que menor é melhor, a direção é invertida. SRM é um qui-quadrado sobre o split planejado, com alerta em p &lt; 0,001. Método completo em docs/specs/frente-04/METODO.md.</p>
    <p class="lineage"><b>Fonte dos dados:</b> ${r.lineage.map((l) => `${esc(l.metricId === '*' ? 'todas as métricas' : metricName(l.metricId))}: ${esc(l.sourceTable)} (${esc(l.sqlRef)}, ${esc(l.sqlVersion)})`).join(' · ')}</p>
    ${r.notes?.length ? `<ul class="notes">${r.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</details>`;
  $('#main').innerHTML = head + filters + banners.join('') + doit + sint + tilesHtml + charts + design + table + raw + how;
}

async function render() {
  try {
    S.metrics ??= await api('/metrics');
    if (S.view === 'list') await renderList(); else await renderDetail();
  } catch (err) { $('#main').innerHTML = `<div class="panel"><h2>Erro</h2><p class="muted">${esc(err.message)}</p></div>`; }
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-go],[data-open],[data-set],[data-export],[data-theme-toggle]');
  if (!t) return;
  if (t.dataset.themeToggle != null) { const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'light' : 'dark'; return; }
  if (t.dataset.export) { ev.preventDefault(); doExport(t.dataset.export); return; }
  if (t.dataset.go) { S.view = 'list'; S.faroId = null; window.scrollTo({ top: 0 }); }
  if (t.dataset.open) { S.view = 'detail'; S.faroId = t.dataset.open; S.platform = 'all'; S.grain = 'user'; window.scrollTo({ top: 0 }); }
  if (t.dataset.set) S[t.dataset.set] = t.dataset.v;
  render();
});
render();

</script>
