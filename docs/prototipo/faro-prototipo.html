<style>

}

:root[data-theme="dark"]{
  --bg:#150B21;--surface:#1F132E;--ink:#F1EAF9;--muted:#A99BBB;--line:#352648;
  --brand:#B892EA;--on-brand:#1A0E28;--brand-soft:#2C1D40;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--brand-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-running{color:var(--ok);background:var(--ok-soft)}
.s-scheduled{color:var(--brand);background:var(--brand-soft)}
.s-decided{color:var(--warn);background:var(--warn-soft)}
.bar.decided{background:var(--warn-soft);color:var(--warn)}
.tg-real{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.s-finished{color:var(--muted);background:var(--line)}
.risk{color:var(--risk);background:var(--risk-soft)}
.warnp{color:var(--warn);background:var(--warn-soft)}
.okp{color:var(--ok);background:var(--ok-soft)}
/* stepper */
.steps{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;font-weight:600;color:var(--muted)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink)}
.step[aria-current="true"]{color:var(--ink);border-color:var(--brand)}
.step[aria-current="true"] .n{background:var(--brand);color:var(--on-brand)}
.step.done .n{background:var(--ok);color:#fff}
.step.locked{cursor:not-allowed;opacity:.6}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.sticky{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
.field{margin-bottom:20px}
.field label,.field .lbl{display:block;font-weight:700;margin-bottom:4px}
.field .hint{font-size:13px;color:var(--muted);margin:0 0 8px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .sub{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:disabled{opacity:.35;cursor:not-allowed}

.gatebox{border-radius:16px;padding:20px;background:var(--gate-soft);border:1px solid color-mix(in srgb,var(--gate) 55%,transparent)}
.meter{height:10px;border-radius:999px;background:color-mix(in srgb,var(--gate) 25%,var(--surface));overflow:hidden;margin:12px 0 14px}

.checks{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:7px;font-size:14px}

.tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:2px;display:grid;place-items:center}
.checks li.ok .tick{background:var(--ok);border-color:var(--ok)}
.checks li.ok .tick::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checks li.ok{color:var(--muted)}
.unlocked{display:flex;gap:10px;align-items:center;font-weight:700}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font-size:22px;letter-spacing:-.02em}
.callout{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.conf{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;background:var(--surface)}
.conf.alto{border-color:color-mix(in srgb,var(--risk) 50%,var(--line))}
.radio{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.radio input{margin-top:4px;accent-color:var(--brand)}
.radio label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
dl.sum{display:grid;grid-template-columns:200px 1fr;gap:10px 18px;margin:0}
dl.sum dt{color:var(--muted);font-weight:600}
dl.sum dd{margin:0}
/* map */
.map{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.map-inner{min-width:860px;position:relative}
.mrow{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mlabel{padding:12px 14px;font-weight:700;font-size:14px;border-right:1px solid var(--line)}
.mtrack{position:relative}
.bar{position:absolute;height:28px;border-radius:8px;font-size:12.5px;font-weight:600;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:2px solid transparent}
.bar.running{background:var(--ok-soft);color:var(--ok)}
.bar.scheduled{background:var(--brand-soft);color:var(--brand)}
.bar.finished{background:var(--line);color:var(--muted)}
.bar.clash{border-color:var(--risk);border-style:dashed}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--gate);z-index:2}
.weeks{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.weeks .t{position:relative;height:30px}
.weeks .t span{position:absolute;top:7px;transform:translateX(-2px)}
/* results */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.ci{position:relative;height:34px;margin:8px 0 4px}
.ci .axis{position:absolute;top:16px;left:0;right:0;height:2px;background:var(--line)}
.ci .zero{position:absolute;top:4px;bottom:4px;width:2px;background:var(--muted)}
.ci .rng{position:absolute;top:11px;height:12px;border-radius:6px}
.ci .pt{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;transform:translateX(-9px);border:3px solid var(--surface)}
.design-card{border-left:4px solid var(--gate);padding:4px 0 4px 18px;margin-bottom:24px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:9;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:14px;display:inline-block}
.back:hover{color:var(--ink)}
.mform{border:1px dashed var(--brand);border-radius:14px;padding:16px;margin-top:12px;background:var(--brand-soft)}
.mform .sub{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.chip.add{border-style:dashed;color:var(--brand);font-weight:600}
.chip .x{margin-left:4px;opacity:.6}
.basebox{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}

.tg{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tg-norte{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-size:10.5px;padding:1px 7px;letter-spacing:.04em}
.tg-guarda{border-color:var(--warn);color:var(--warn);font-size:10.5px;padding:1px 7px;letter-spacing:.04em}
.tg-sec{font-size:10.5px;padding:1px 7px}
.tg-risk{border-color:var(--risk);color:var(--risk);background:var(--risk-soft)}
.tg-warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:18px}
.vars div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.sintese{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:14.5px}
.doit{border-radius:12px;padding:14px 18px;border-left:5px solid}
.doit b{font-size:17px}.doit p{margin:4px 0 0;font-size:14px}
.do-ok{background:var(--ok-soft);border-color:var(--ok)}.do-warn{background:var(--gate-soft);border-color:var(--gate)}.do-risk{background:var(--risk-soft);border-color:var(--risk)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
table.mt{min-width:760px}
.mt td,.mt th{padding:10px 14px}
td.num,th.num{text-align:right}
.vline{border-left:2px solid var(--brand-soft)}
tr.msec td{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:18px;background:transparent!important}

.mt tbody tr:hover td{background:inherit}

.sg{display:inline-flex;gap:4px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.sg .pp{font-weight:500;opacity:.8}
.sg-up{color:var(--ok);background:var(--ok-soft)}.sg-down{color:var(--risk);background:var(--risk-soft)}
.sg-tup{color:var(--ok);border-color:var(--ok)}.sg-tdown{color:var(--warn);background:var(--warn-soft)}.sg-none{color:var(--muted)}
.health{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.health td,.health th{padding:8px 10px}
.how{margin-top:24px;color:var(--muted);font-size:14px}.how summary{cursor:pointer;font-weight:700;color:var(--ink)}.how p{max-width:75ch}
@media (max-width:900px){.health{grid-template-columns:1fr}}
.bar.ext{opacity:.55;border-style:dotted}
.empty{padding:28px;text-align:center;color:var(--muted)}
.figin{margin-top:8px;font-size:14px}
.fig-err{font-size:12.5px;color:var(--risk);margin:4px 0 0;min-height:1em}
.figlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.figlink{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none}
.figlink:hover{background:var(--brand-soft)}
.figlink svg{flex:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:12px 16px;gap:16px;z-index:5;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px);overflow-x:auto}
  aside nav{flex-direction:row}
  nav button{white-space:nowrap}
  .side-note,.logo small{display:none}
  .grid2{grid-template-columns:1fr}
  .sticky{position:static}
  dl.sum{grid-template-columns:1fr}
  dl.sum dd{margin-bottom:8px}
  .pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

function segInter(A,B){const a=A.segment,b=B.segment,sa=segOf(A),sb=segOf(B);if(a==='todos')return sb.share;if(b==='todos')return sa.share;
  if(a!=='custom'&&b!=='custom'){if(a===b)return sa.share;if(DISJOINT.some(([p,q])=>(p===a&&q===b)||(p===b&&q===a)))return 0;return sa.share*sb.share}

function overlap(a,b){
  if(a.end<b.start||b.end<a.start)return null;
  const pages=a.pages.filter(p=>b.pages.includes(p));if(!pages.length)return null;

/* map */
function vMap(){
  const A='2026-09-01',B='2026-11-30',span=days(A,B);
  const x=s=>Math.max(0,Math.min(100,days(A,s)/span*100));
  const own=EXPS.filter(e=>inBU(e,S.buf));
  const ext=S.buf==='todas'?[]:EXPS.filter(e=>!own.includes(e)&&e.status!=='finished'&&own.some(o=>o.status!=='finished'&&overlap(e,o)));
  const pool=[...own,...ext];
  const used=Object.keys(PAGES).filter(p=>pool.some(e=>e.pages.includes(p)));
  const weeks=[];for(let i=0;i<=span;i+=14){const dt=new Date(new Date(A).getTime()+i*864e5).toISOString().slice(0,10);weeks.push(`<span style="left:${i/span*100}%">${dm(dt)}</span>`)}
  const lanes=used.map(p=>{
    const es=pool.filter(e=>e.pages.includes(p)&&(!ext.includes(e)||own.some(o=>{const v=o.status!=='finished'&&overlap(e,o);return v&&v.pages.includes(p)}))).sort((a,b)=>a.start.localeCompare(b.start));const rows=[];
    const bars=es.map(e=>{let r=rows.findIndex(end=>end<e.start);if(r<0){r=rows.length;rows.push(e.end)}else rows[r]=e.end;
      const clash=e.status!=='finished'&&es.some(o=>o!==e&&o.status!=='finished'&&overlap(e,o));
      const isExt=ext.includes(e);return `<div class="bar ${e.status} ${clash?'clash':''} ${isExt?'ext':''}" data-open="${e.id}" title="${esc(e.name)} (${BUS[e.bu].n})" style="left:${x(e.start)}%;width:${x(e.end)-x(e.start)}%;top:${8+r*34}px">${isExt?BUS[e.bu].n+': ':''}${esc(e.name)}</div>`}).join('');
    return `<div class="mrow"><div class="mlabel">${PAGES[p].n}</div><div class="mtrack" style="height:${16+rows.length*34}px"><div class="today" style="left:${x(TODAY)}%"></div>${bars}</div></div>`}).join('');
  const clashes=[];EXPS.forEach((a,i)=>EXPS.slice(i+1).forEach(b=>{if(a.status!=='finished'&&b.status!=='finished'&&(inBU(a,S.buf)||inBU(b,S.buf))){const o=overlap(a,b);if(o)clashes.push({a,b,o})}}));
  return `<h1>Mapa de sobreposição</h1><p class="lead">Testes por página ao longo do tempo. Contorno tracejado indica que o teste divide público com outro na mesma página. A linha amarela é hoje. Ao filtrar uma BU, testes de outras BUs que cruzam com ela aparecem esmaecidos, com o nome da BU.</p>
  <div style="margin-bottom:16px">${buFilter()}</div>
  <div class="map"><div class="map-inner"><div class="weeks"><div></div><div class="t">${weeks.join('')}</div></div>${lanes}</div></div>
  <h2 style="margin-top:32px">Conflitos ativos</h2>
  ${clashes.length?clashes.map(({a,b,o})=>`<div class="conf ${o.sev}"><div class="spread"><div><h3>${esc(a.name)} × ${esc(b.name)}</h3>${a.bu!==b.bu?`<span class="tg tg-warn" style="margin-top:4px">Entre BUs: ${BUS[a.bu].n} × ${BUS[b.bu].n}</span>`:''}<p class="small muted" style="margin:4px 0 0">${o.pages.map(p=>PAGES[p].n).join(', ')} em ${o.plats.map(p=>PLATS[p].n).join(', ')} · ${dm(o.from)} a ${dm(o.to)} · ~${fmt(o.daily)} usuários/dia nos dois (${pct(o.daily/Math.max(1,eligible(a)))} de um, ${pct(o.daily/Math.max(1,eligible(b)))} do outro)</p></div><span class="pill ${SEVL[o.sev][1]}">${SEVL[o.sev][0]}</span></div></div>`).join(''):'<p class="muted">Nenhum conflito.</p>'}`;
}

function ciBar(lo,lift,hi,col){

}

function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function hash(t){let h=7;for(const ch of t)h=(h*31+ch.charCodeAt(0))%2147483647;return h}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function rowsFor(e){const u=new Set(['rpu','conv','tpu','ticket','rfpu','m2','atc','repet','clube','rclube','churnc','saude','vidas','rsaude']);[e.primary,...e.secondary].forEach(m=>MAPROW[m]&&u.add(MAPROW[m]));e.guardrails.forEach(g=>ROWS[g]&&u.add(g));return Object.keys(ROWS).filter(k=>u.has(k))}
function tagOf(e,k){if(MAPROW[e.primary]===k)return'norte';if(e.guardrails.includes(k))return'guarda';if(e.secondary.some(m=>MAPROW[m]===k))return'sec';return''}
const nEff=(r,n)=>r.perBuyer?n*.05:n;
function gen(e,grain){
  e._c=e._c||{};if(e._c[grain])return e._c[grain];
  const R=e.results,sess=grain==='sessao',nf=sess?1.7:1,plats={};
  for(const p of e.platforms){const u=R.users[p];if(!u)continue;const n=[Math.round(u[0]*nf),Math.round(u[1]*nf)],rows={};
    for(const k in ROWS){const r=ROWS[k];let b=(R.base&&R.base[k])??r.base;
      if(sess&&!r.noSess)b/=r.kind==='rate'?1.55:nf;
      const rnd=rng(hash(e.id+k+p+grain)),c=b*(1+gauss(rnd)*.05),n0=nEff(r,Math.min(...n));
      const se=r.kind==='rate'?Math.sqrt((1-c)/c*2/n0):r.cv*Math.sqrt(2/n0);
      rows[k]=[c,c*(1+(R.lifts[k]||0)+gauss(rnd)*se*.3)]}
    plats[p]={n,rows}}
  const ps=Object.values(plats),n=[0,1].map(i=>ps.reduce((s,x)=>s+x.n[i],0)),rows={};
  for(const k in ROWS)rows[k]=[0,1].map(i=>ps.reduce((s,x)=>s+x.rows[k][i]*x.n[i],0)/n[i]);
  return e._c[grain]={plats,all:{n,rows}};
}
function rstat(r,[c,v],[nc,nv]){if(!c)return null;const a=nEff(r,nc),b=nEff(r,nv);

  const z=(v-c)/se;return{delta:(v-c)/c,P:r.lower?phi(-z):phi(z),better:r.lower?v<c:v>c}}
function sig(P){const pp=Math.round(P*100);
  if(P>=.95)return{t:'Melhora confirmada',c:'sg-up',a:'▲',pp,w:'melhora confirmada'};
  if(P<=.05)return{t:'Queda confirmada',c:'sg-down',a:'▼',pp,w:'queda confirmada'};
  if(P>=.8)return{t:'Tendência de melhora',c:'sg-tup',a:'▲',pp,w:'tendência de melhora'};
  if(P<=.2)return{t:'Tendência de queda',c:'sg-tdown',a:'▼',pp,w:'tendência de queda'};
  return{t:'Sem tendência',c:'sg-none',a:'',pp,w:'sem tendência'}}
function fv(r,x){if(x==null||isNaN(x))return'–';if(r.kind==='rate')return pct(x,2);
  if(r.fmt==='money')return'R$ '+x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(r.fmt==='sec')return x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' s';
  return x.toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4})}
const TAGH={norte:'<span class="tg tg-norte">NORTE</span>',guarda:'<span class="tg tg-guarda">GUARDA</span>',sec:'<span class="tg tg-sec">SECUNDÁRIA</span>'};
const lbl=(s,g)=>g==='sessao'?s.replace('por usuário','por sessão'):s;
function deltaCell(d,good){return `<td class="num" style="color:${good?'var(--ok)':'var(--risk)'}">${d>0?'+':''}${(d*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}%</td>`}
function metricTable(e,D,grain){
  const[nc,nv]=D.n,R=D.rows,money0=x=>'R$ '+fmt(x);
  const vol=[[grain==='sessao'?'Sessões':'Usuários',nc,nv,fmt],['Compradores',nc*R.conv[0],nv*R.conv[1],fmt],['Transações',nc*R.tpu[0],nv*R.tpu[1],fmt],['Receita',nc*R.rpu[0],nv*R.rpu[1],money0]];
  let h=vol.map(([n,a,b,f])=>`<tr><td><b>${n}</b></td><td class="num">${f(a)}</td><td class="num vline">${f(b)}</td>${deltaCell((b-a)/a,b>=a)}<td class="muted">—</td></tr>`).join('');
  let sec='';
  for(const k of rowsFor(e)){const r=ROWS[k],t=tagOf(e,k),s=rstat(r,R[k],D.n);
    if(r.sec!==sec){sec=r.sec;h+=`<tr class="msec"><td colspan="5">${sec}</td></tr>`}
    const g=s&&sig(s.P);
    h+=`<tr class="${t==='norte'?'norte':''}"><td><b>${lbl(r.n,grain)}</b> ${TAGH[t]||''}</td><td class="num">${fv(r,R[k][0])}</td><td class="num vline">${fv(r,R[k][1])}</td>${s?deltaCell(s.delta,s.better):'<td class="num muted">—</td>'}<td>${g?`<span class="sg ${g.c}">${g.a} ${g.t} <span class="pp">(${g.pp}%)</span></span>`:'—'}</td></tr>`}
  return `<div class="table-wrap"><table class="mt"><thead><tr><th>Métrica</th><th class="num">Controle</th><th class="num vline">Variante A</th><th class="num">Delta</th><th>Significância <span class="small">(chance de a variante ser melhor)</span></th></tr></thead><tbody>${h}</tbody></table></div>`;
}
function daily(e,plat){const R=e.results,end=e.status==='finished'?e.end:DATA_END,run=Math.max(1,days(e.start,end)+1),out=[];
  for(let i=13;i>=0;i--){const dt=new Date(new Date(end).getTime()-i*864e5).toISOString().slice(0,10);if(dt<e.start)continue;
    const rnd=rng(hash(e.id+dt+plat)),wf=[.82,1.1,1.05,1,1,.96,.86][new Date(dt).getUTCDay()];let a=0,b=0;
    (plat==='all'?e.platforms:[plat]).forEach(p=>{const u=R.users[p];if(u){a+=u[0]/run*wf*(.9+rnd()*.2);b+=u[1]/run*wf*(.9+rnd()*.2)}});
    const D=gen(e,'usuario'),src=plat==='all'?D.all:D.plats[plat],k=MAPROW[e.primary],r=ROWS[k];
    out.push({dt,a,b,pa:src.rows[k][0]*(1+gauss(rnd)*.09),pb:src.rows[k][1]*(1+gauss(rnd)*.09),r})}

function chart(pts,mode){

  const r=pts[0].r,tk=v=>mode==='users'?(v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':fmt(v)):fv(r,v);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${tk(v)}</text>`}
  pts.forEach((p,i)=>{if(i%2===0)g+=`<text x="${L+step*i+step/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${dm(p.dt)}</text>`});
  if(mode==='users'){const bw=step*.34;pts.forEach((p,i)=>{const x=L+step*i+step/2;g+=`<rect x="${x-bw-1}" y="${y(p.a)}" width="${bw}" height="${H-B-y(p.a)}" rx="2" fill="var(--muted)"><title>${dm(p.dt)} controle: ${fmt(p.a)}</title></rect><rect x="${x+1}" y="${y(p.b)}" width="${bw}" height="${H-B-y(p.b)}" rx="2" fill="var(--brand)"><title>${dm(p.dt)} variante: ${fmt(p.b)}</title></rect>`})}
  else{const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map((p,i)=>`${L+step*i+step/2},${y(p[k])}`).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${L+step*i+step/2}" cy="${y(p[k])}" r="3" fill="${c}"><title>${dm(p.dt)}: ${fv(r,p[k])}</title></circle>`).join('');g+=line('pa','var(--muted)')+line('pb','var(--brand)')}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${mode==='users'?'Usuários expostos por dia':'Métrica norte por dia'}" style="width:100%;height:auto;display:block">${g}</svg>`}
function seg(k,opts){return `<div class="seg" role="group">${opts.map(([v,t])=>`<button type="button" data-act="dset" data-k="${k}" data-v="${v}" aria-pressed="${S[k]===v}">${t}</button>`).join('')}</div>`}

/* ---------- teste real (export do DY, 13/10) ---------- */
const SGC={up:['Melhora confirmada','sg-up','▲'],down:['Queda confirmada','sg-down','▼'],tup:['Tendência de melhora','sg-tup','▲'],tdown:['Tendência de queda','sg-tdown','▼'],none:['Sem tendência','sg-none','—']};

const fd=d=>(d>0?'+':'')+d.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
function realTable(e,D){

function vReal(e){

  return `
   <div class="banner">${R.banner}</div>
   <div class="vars"><div class="sub">Variantes</div>
    <div><span class="dot" style="background:var(--muted)"></span><b>${esc(an)}</b> <span class="muted">(controle, pelo nome)</span> <span class="tg">${R.split[0]}%</span></div>
    <div><span class="dot" style="background:var(--brand)"></span><b>${esc(bn)}</b> <span class="tg">${R.split[1]}%</span></div></div>
   <div class="sub" style="margin-top:20px">Síntese</div><div class="sintese">${R.sintese}</div>
   <div class="sub" style="margin-top:20px">O que fazer <span class="muted" style="font-weight:500">· grão usuário, consolidado, decide por receita por usuário</span></div>
   <div class="doit do-warn"><b>${R.decision[0]}</b><p>${R.decision[1]}</p></div>
   <div class="spread" style="margin:28px 0 12px;align-items:center"><h2 style="margin:0">Métricas</h2><div class="row"><div class="seg"><button type="button" aria-pressed="true">Usuário</button><button type="button" disabled title="O export atual do DY traz só grão usuário" style="opacity:.45;cursor:not-allowed">Sessão</button></div>${seg('plat',[['all','Consolidado'],...Object.keys(R.fixed.plats).map(p=>[p,PLATS[p].n])])}</div></div>
   ${realTable(e,D)}
   <div class="sub" style="margin-top:32px">Saúde do teste</div>
   <div class="health">
    <div class="panel"><h3>Usuários expostos</h3><p class="small muted" style="margin:0 0 6px">Novos usuários expostos por dia, 30/09 a 13/10, app (Android e iOS).</p>
     ${chart(pts,'users')}
     <div class="row small muted" style="gap:16px;margin-top:6px"><span><span class="dot" style="background:var(--muted)"></span>${esc(an)}</span><span><span class="dot" style="background:var(--brand)"></span>${esc(bn)}</span></div>
     <p class="small muted" style="margin:8px 0 0">Valores diários aproximados, lidos do gráfico do visualizador. Com 98% do tráfego na home nova, o controle quase não aparece.</p></div>
    <div class="panel"><h3>Detectabilidade hoje</h3><p class="small muted" style="margin:0 0 10px">Menor diferença relativa que o teste consegue detectar com a base atual (80% de poder). Efeito observado abaixo do MDE é ruído até prova em contrário.</p>
     <div class="table-wrap" style="border:0"><table style="min-width:0"><thead><tr><th>Métrica</th><th class="num">MDE</th></tr></thead><tbody>${mde}</tbody></table></div></div>
   </div>
   <details class="how"><summary>Como os números são calculados</summary><p>Dados do export D-1 do Dynamic Yield, grão usuário, janela de leitura de 31/08 a 12/10 (split estável). Usuários que viram as duas variantes são excluídos. "Chance de ser melhor" acima de 95% é melhora confirmada e abaixo de 5% é queda confirmada; entre 80% e 95% (ou 5% e 20%) é tendência. Os deltas das métricas por usuário vêm do cálculo do visualizador, por isso não batem com a simples razão entre os valores exibidos.</p></details>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-open],[data-step],[data-chip],[data-act]');if(!t)return;
  if(t.dataset.go){S.view=t.dataset.go;if(S.view==='new'&&S.step>1&&!designOk(S.d))S.step=1;render();return}
  if(t.dataset.open){S.view='detail';S.id=t.dataset.open;render();return}
  if(t.dataset.step){const n=+t.dataset.step;if(canGo(n)){S.step=n;render();if(n===2&&S._first!==true){S._first=true;toast('Design completo. Público liberado.')}}return}
  if(t.dataset.chip){const f=t.dataset.chip,v=t.dataset.val,d=S.d;
    if(t.dataset.multi==='1'){d[f]=d[f].includes(v)?d[f].filter(x=>x!==v):[...d[f],v]}
    else{d[f]=f==='variants'?+v:(d[f]===v&&f==='primary'?'':v);if(f==='primary'){d.secondary=d.secondary.filter(x=>x!==d.primary);d.base=null}if(f==='segment'&&SEG[v]){d.segText=SEG[v].n;d.segShare=Math.round(SEG[v].share*100)}}
    render();return}
  if(t.dataset.act==='example'){Object.assign(S.d,{name:'Selo de entrega rápida na busca',owner:'Squad Descoberta',context:'Dados de busca mostram que 38% das sessões que buscam ração terminam sem clique em produto, e no NPS o prazo de entrega é o 2º motivo de reclamação. Hoje o prazo só aparece na página de produto.',hypothesis:'Se mostrarmos o selo “chega amanhã” nos cards da busca, então a adição ao carrinho vai aumentar, porque o cliente sabe o prazo antes de abrir o produto.',control:'Card da busca sem informação de entrega',variant:'Card com selo “Chega amanhã” quando o CEP permite',base:null,primary:'atc',secondary:['conv','rpv'],guardrails:['load'],mde:5,pages:['busca','carrinho'],platforms:['site','android','ios']});render();return}
  if(t.dataset.act==='dset'){S[t.dataset.k]=t.dataset.v;render();return}
  if(t.dataset.act==='newmetric'){S.nm={open:true,name:'',type:'taxa',base:'',sd:'',def:''};render();const i=document.querySelector('[data-nm="name"]');if(i)i.focus();return}
  if(t.dataset.act==='cancelmetric'){S.nm.open=false;render();return}
  if(t.dataset.act==='savemetric'){const m=S.nm,b=parseFloat(String(m.base).replace(',','.')),sd=parseFloat(String(m.sd).replace(',','.')),err=$('#nm-err');
    if(m.name.trim().length<3){err.textContent='Dê um nome com pelo menos 3 caracteres.';return}
    if(Object.values(METRICS).some(x=>x.n.toLowerCase()===m.name.trim().toLowerCase())){err.textContent='Já existe uma métrica com esse nome.';return}
    if(!(b>0)||(m.type==='taxa'&&b>=100)){err.textContent=m.type==='taxa'?'Informe a taxa atual entre 0 e 100%.':'Informe a média atual.';return}
    if(m.type==='valor'&&!(sd>0)){err.textContent='Informe o desvio padrão.';return}
    const k='c'+Date.now();METRICS[k]=m.type==='taxa'?{n:m.name.trim(),base:b/100,def:m.def.trim(),custom:true}:{n:m.name.trim(),cv:+(sd/b).toFixed(2),def:m.def.trim(),custom:true};
    if(!S.d.primary){S.d.primary=k;S.d.base=null}S.nm.open=false;render();toast(`Métrica “${m.name.trim()}” criada.`);return}
  if(t.dataset.act==='create'){const d=S.d;EXPS.unshift({...d,id:'e'+Date.now(),status:'scheduled',owner:d.owner||'Meu squad',resolutions:{...d.resolutions}});S.d=blank();S.step=1;S._first=false;S.view='list';render();toast('Experimento criado e configuração enviada ao Dynamic Yield.');return}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.res){S.d.resolutions[t.dataset.res]=t.value;render();return}
  if(t.dataset.nm){S.nm[t.dataset.nm]=t.value;if(t.dataset.nm==='type'){S.nm.base='';S.nm.sd='';render()}return}
  const f=t.dataset.f;if(!f)return;const d=S.d;
  d[f]=(f==='mde'||f==='traffic')?+t.value:(f==='base'||f==='segShare')?(t.value===''?null:+t.value):t.value;
  if(f==='segText'){const k=Object.keys(SEG).find(k=>SEG[k].n.toLowerCase()===t.value.trim().toLowerCase());d.segment=k||'custom';document.querySelectorAll('[data-chip="segment"]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.val===d.segment)))}
  if(S.step===1){
    if(f==='mde'||f==='base'){if(f==='mde')$('#mde-v').textContent=d.mde+'%';const n=sampleSize(d.primary,d.mde,d.base);$('#ss').innerHTML=n?`Amostra necessária: <b>${fmt(n)}</b> usuários por grupo.`:'Escolha a métrica primária para calcular a amostra.'}
    if(f==='figmaBefore'||f==='figmaAfter'){const er=document.getElementById('err-'+f);if(er)er.textContent=figErr(d[f])}
    $('#gate').outerHTML=gatePanel();
    const sb=document.querySelector('.steps');sb.outerHTML=stepsBar();
  }else if(S.step===2){
    if(f==='traffic')$('#tr-v').textContent=d.traffic+'%';
    $('#est').outerHTML=estimatePanel();document.querySelector('.steps').outerHTML=stepsBar();
  }
});
render();
</script>
</body>
</html>
